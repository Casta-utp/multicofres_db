<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Multicofres{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-dark bg-dark justify-content-between mb-4 py-3 px-4 shadow">
        <span class="navbar-brand fw-bold">⚙️ Panel de Administración</span>
        <a href="/logout" class="btn btn-danger">Cerrar Sesión</a>
    </nav>
    
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg">
                    <div class="card-body">
                        <h3 class="text-center mb-4">Registrar Salario</h3>
                        {% if error %}
                            <div class="alert alert-danger" role="alert">
                                {{ error }}
                            </div>
                        {% endif %}
                        {% if success %}
                            <div class="alert alert-success" role="alert">
                                {{ success }}
                            </div>
                        {% endif %}
                        <form method="POST" action="/add_salary_manager">
                            <div class="mb-3">
                                <label class="form-label">Administrador</label>
                                <select name="manager_id" class="form-control" required>
                                    <option value="" disabled selected>Seleccione un Administrador</option>
                                    {% for manager in managers %}
                                        <option value="{{ manager.id }}">{{ manager.first_name }} {{ manager.last_name }}</option>
                                    {% endfor %}
                                </select> 
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Salario</label>
                                <input type="number" name="income" class="form-control" min="0" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Fecha de Inicio</label>
                                <input type="date" name="ini_date" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Número de Cuenta</label>
                                <input type="text" name="account_number" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Registrar</button>
                        </form>
                        <a href="/menu/salarios_administrador" class="btn btn-secondary mt-3 w-100">Volver</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

<style>
    body {
        background-color: #f2f4f8;
        color: #212529;
        animation: fadeIn 0.5s ease-in;
        min-height: 100vh;
    }

    /* Navbar */
    .navbar {
        padding: 1rem 2rem;
        animation: slideDown 0.6s ease-out;
    }

    .navbar-brand {
        font-weight: bold;
        font-size: 1.5rem;
    }

    /* Botones */
    .btn {
        font-weight: 500;
        transition: all 0.2s ease-in-out;
    }

    .btn:hover {
        transform: scale(1.05);
    }

    /* Tarjetas, tablas, elementos blancos */
    .card, .table, .bg-white {
        border-radius: 12px;
        box-shadow: 0 0.25rem 1rem rgba(0, 0, 0, 0.05);
        animation: fadeInUp 0.6s ease-out;
    }

    /* Títulos */
    h1, h2, h3, h4 {
        font-weight: bold;
        margin-bottom: 1rem;
    }

    /* Contenedor principal */
    .container {
        margin-top: 2rem;
        animation: fadeInUp 0.7s ease-out;
    }

    /* Inputs en foco */
    .form-control:focus {
        border-color: #0d6efd;
        box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
    }

    /* Encabezados de tabla */
    .table th {
        background-color: #e9ecef;
    }

    /* === ANIMACIONES PERSONALIZADAS === */
    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes slideDown {
        from {
            opacity: 0;
            transform: translateY(-30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* === Clases reutilizables === */
    .fade-in {
        animation: fadeIn 0.6s ease-in;
    }

    .fade-in-up {
        animation: fadeInUp 0.6s ease-out;
    }

    .slide-down {
        animation: slideDown 0.6s ease-out;
    }

    /* === RESPONSIVE AJUSTES === */
    @media (max-width: 768px) {
        .navbar {
            padding: 0.8rem 1rem;
            flex-direction: column;
            text-align: center;
        }

        .navbar-brand {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
        }

        .btn {
            font-size: 0.9rem;
            padding: 0.5rem 1rem;
        }

        .container {
            margin-top: 1rem;
            padding: 0 1rem;
        }

        h1, h2, h3, h4 {
            font-size: 1.5rem;
            text-align: center;
        }

        .card, .table, .bg-white {
            box-shadow: 0 0.2rem 0.6rem rgba(0, 0, 0, 0.05);
        }
    }

    @media (max-width: 576px) {
        .navbar {
            padding: 0.5rem 1rem;
        }

        .btn {
            width: 100%;
            margin-bottom: 0.5rem;
        }

        .container {
            margin-top: 1rem;
        }

        .d-flex.justify-content-center {
            flex-direction: column;
            align-items: center;
        }

        .col-md-6 {
            width: 100%;
        }
    }

</style>
